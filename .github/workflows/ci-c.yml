name: CI - C

on:
  push:
    branches: [master]
  pull_request:

jobs:
  c:
    name: C xform tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install xsltproc and libxml2
        run: sudo apt-get install -y xsltproc libxml2-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Build C xform binary
        run: |
          cmake -S xform-c -B xform-c/build
          cmake --build xform-c/build

      - name: Run tests
        run: uv sync --extra dev && uv run python -m pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}
          XF_TEST_LANGS: python,c
