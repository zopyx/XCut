name: CI - Java

on:
  push:
    branches: [master]
  pull_request:

jobs:
  java:
    name: Java xform tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install xsltproc
        run: |
          sudo apt-get update
          sudo apt-get install -y xsltproc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        run: pip install uv

      - name: Build Java xform
        run: make build-java

      - name: Run Java transformation tests
        run: |
          uv sync --extra dev
          uv run python -m pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}
          XF_TEST_LANGS: java
